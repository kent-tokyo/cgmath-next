[package]
name = "fixture-dual-dep"
version = "0.0.0"
edition = "2021"
publish = false

# Real upstream cgmath 0.18.0 and the renamed cgmath-next present at once,
# under different local names. Proves the two crates don't collide, and
# doubles as the differential-testing harness scaffold (AGENTS.md 11.2).
[dependencies]
cgmath = { version = "0.18.0", features = ["serde", "mint"] }
cgmath_next = { package = "cgmath-next", path = "../../..", features = ["serde", "mint"] }
mint = "0.5"
serde = "1.0"
serde_json = "1.0"
