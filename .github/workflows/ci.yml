name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CHANGELOG.md"
  schedule:
    # Catch dependency-driven breakage (MSRV drift, advisory-db updates)
    # even with no code changes. See docs/msrv.md.
    - cron: "0 0 * * 0"

env:
  RUST_BACKTRACE: 1
  # docs/msrv.md: measured against today's dependency resolution, will
  # need re-measuring (not just bumping) if this ever fails here.
  MSRV: "1.71"

jobs:
  # AGENTS.md section 15, "通常CI". check/test/doc are blocking; fmt and
  # clippy are informational only for now (baseline has pre-existing
  # findings recorded in docs/baseline.md -- see the staged rollout plan
  # there before flipping these to blocking with -D warnings).
  test:
    name: test (${{ matrix.os }}, ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        toolchain: [stable]
        include:
          - os: ubuntu-latest
            toolchain: "1.71" # declared MSRV, see docs/msrv.md
          - os: ubuntu-latest
            toolchain: beta
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo check
      - run: cargo check --no-default-features
      - run: cargo test
      - run: cargo test --all-features
      - run: cargo test --doc

  fmt:
    name: fmt (informational -- see docs/baseline.md)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy (informational -- see docs/baseline.md)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Not --all-targets: the inherited benches/ use the unstable
      # `#[feature(test)]` harness and cannot build on stable at all,
      # independent of any lint result -- see docs/baseline.md.
      - run: cargo clippy --lib --tests --all-features

  security:
    name: cargo audit / cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # cargo-deny generates its own lockfile internally, but
      # rustsec/audit-check needs one already on disk to scan -- this repo
      # is a library and correctly doesn't commit Cargo.lock (see
      # .gitignore), so generate an ephemeral one here, CI-only.
      - run: cargo generate-lockfile
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          arguments: --all-features

  compat:
    name: compatibility fixtures (serde/mint differential, swizzle gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # compat/fixtures/dual-dep: pulls real upstream cgmath 0.18.0
      # alongside this crate under different local names and asserts
      # byte-exact serde JSON + verified mint conversions between them.
      # See docs/compatibility.md's differential-testing section.
      - name: serde/mint differential tests vs upstream cgmath 0.18.0
        working-directory: compat/fixtures/dual-dep
        run: cargo test
      # compat/fixtures/swizzle-off: deliberately does not enable the
      # swizzle feature and calls a swizzle method. Must fail -- a
      # successful build here would mean a swizzle method leaked into
      # the public API without the feature. Checks the exit code AND
      # the specific error (E0599 on `xy`), not just "something failed",
      # so an unrelated build breakage can't be mistaken for a pass.
      # See compat/fixtures/swizzle-off/README.md.
      - name: swizzle-off negative control (must fail without the feature)
        working-directory: compat/fixtures/swizzle-off
        run: |
          set +e
          OUTPUT=$(cargo build 2>&1)
          STATUS=$?
          echo "$OUTPUT"
          if [ "$STATUS" -eq 0 ]; then
            echo "::error::expected cargo build to fail without the swizzle feature, but it succeeded"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "E0599"; then
            echo "::error::expected E0599 in build output, not found"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "no method"; then
            echo "::error::expected 'no method' in build output, not found"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "xy"; then
            echo "::error::expected method name 'xy' in build output, not found"
            exit 1
          fi
      - name: swizzle-off positive control (must succeed with the feature on)
        working-directory: compat/fixtures/swizzle-off
        run: cargo build --features cgmath-next/swizzle
      # A check that only asserts absence can pass vacuously if it's
      # pointed at the wrong thing (e.g. a typo in the dependency name),
      # so this asserts both directions: none of serde/mint/rand appear
      # in the default dependency graph, and all three DO appear with
      # --all-features -- proving the check itself can actually detect
      # a leak, not just that it found nothing.
      - name: serde/mint/rand feature-leak check (both directions)
        run: |
          set +e
          # `cargo tree` regenerates the lockfile on a fresh checkout (no
          # Cargo.lock is committed for this library) and its "Updating /
          # Locking / Adding X (available: Y)" preamble mentions optional
          # dependencies like rand/mint even when they're NOT enabled --
          # that preamble text isn't reliably confined to one stream, so
          # slice the captured output down to the actual tree (starting
          # at the crate's own header line) before grepping it, instead
          # of grepping the raw capture.
          NO_FEATURES=$(cargo tree -e normal 2>&1 | sed -n '/^cgmath-next /,$p')
          ALL_FEATURES=$(cargo tree -e normal --all-features 2>&1 | sed -n '/^cgmath-next /,$p')
          FAIL=0
          for dep in serde mint rand; do
            if echo "$NO_FEATURES" | grep -qiE "([[:space:]]|^)${dep} v"; then
              echo "::error::'$dep' appears in the dependency graph with no features enabled -- leak"
              FAIL=1
            fi
            if ! echo "$ALL_FEATURES" | grep -qiE "([[:space:]]|^)${dep} v"; then
              echo "::error::'$dep' does NOT appear in the --all-features dependency graph -- the check above would pass vacuously"
              FAIL=1
            fi
          done
          if [ "$FAIL" -ne 0 ]; then
            echo "--- no-features tree ---"
            echo "$NO_FEATURES"
            echo "--- all-features tree ---"
            echo "$ALL_FEATURES"
            exit 1
          fi

  miri:
    name: miri (targeted suite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # AGENTS.md section 15: a fast targeted suite runs normally; full
      # scope is reserved for release candidates, not every push.
      - name: swap_columns/swap_elements soundness regression
        run: cargo miri test --test soundness
      # --skip test_slerp: Miri has documented non-deterministic float
      # evaluation for transcendental/trig operations (see docs/baseline.md's
      # addendum). slerp's assert_ulps_eq! checks trip on this by ~1e-16.
      # Locally re-running `cargo miri test --lib` repeatedly against both
      # the commit before the layout guard and the guard commit itself
      # produced different slerp sub-test failures each time on both --
      # i.e. the flake predates the guard change and isn't caused by it,
      # even though it wasn't caught by CI until this run. Not a soundness
      # signal; unrelated to any unsafe/conversion path this step exists
      # to cover. The tests themselves are untouched and still run under
      # plain `cargo test` and manual `cargo miri test --lib`.
      - name: representative matrix/vector conversion + unsafe-audited paths
        run: cargo miri test --lib -- --skip test_slerp
