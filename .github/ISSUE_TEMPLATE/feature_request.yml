name: Feature request
description: Propose a new feature or API addition
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please read [CONTRIBUTING.md](../../CONTRIBUTING.md) first: this project
        is currently in a soundness-and-compatibility-focused release series
        (0.18.x), and new features or large redesigns are explicitly deferred
        until after it. Filing an issue is still useful for tracking and
        discussion, but don't expect it to land in a 0.18.x release.
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Why / use case
    validations:
      required: true
